<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Todo App</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            overflow: hidden;
        }

        .main {
            height: 550px;
            width: 480px;
            display: flex;
            flex-direction: column;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .header-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        input {
            height: 52px;
            flex: 1;
            padding: 0 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.35);
        }

        input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: transparent;
        }

        .c {
            height: 44px;
            width: 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .c:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.05);
        }

        .c1 {
            height: 5px;
            width: 5px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        .list {
            width: 100%;
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .list::-webkit-scrollbar {
            width: 5px;
        }

        .list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .list ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list li {
            font-size: 15px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            padding: 14px 18px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .list li:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(4px);
        }

        .list li.selected {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3) 0%, rgba(236, 72, 153, 0.3) 100%);
            border-color: #a855f7;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.25);
            color: #ffffff;
        }

        .option {
            width: 140px;
            display: none;
            background: rgba(23, 23, 35, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            position: absolute;
            border-radius: 16px;
            padding: 6px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            z-index: 100;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        .option div {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option div:hover {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="header-bar">
            <input type="text" disabled id="xyz" placeholder="Press options menu to add...">
            <div class="c">
                <div class="c1"></div>
                <div class="c1"></div>
                <div class="c1"></div>
            </div>
        </div>
        <div class="list">
            <ul>
                <li>make a todo list page</li>
                <li>do best css for guest page</li>
            </ul>
        </div>
    </div>

    <div class="option">
        <div class="add">✨ Add</div>
        <div class="remove">🗑️ Remove</div>
        <div class="edite">✏️ Edit</div>
        <div class="moveup">⬆ Move Up</div>
        <div class="movedown">⬇ Move Down</div>
    </div>

    <script>
        let cir = document.querySelector('.c');
        let op = document.querySelector('.option');
        let inp = document.querySelector('#xyz');
        let add = document.querySelector('.add');
        let remove = document.querySelector('.remove');
        let edit = document.querySelector('.edite');
        let ulList = document.querySelector('.list ul');
        
        let selectedItem = null;

        cir.addEventListener('click', (event) => {
            if (op.style.display === 'block') {
                op.style.display = 'none';
            } else {
                op.style.display = 'block';
                op.style.left = (event.clientX - 100) + "px";
                op.style.top = (event.clientY + 10) + "px";
            }
        });

        document.addEventListener('click', (event) => {
            if (!cir.contains(event.target) && !op.contains(event.target)) {
                op.style.display = 'none';
            }
        });

        ulList.addEventListener('click', (event) => {
            if (event.target.tagName === 'LI') {
                if (selectedItem) {
                    selectedItem.classList.remove('selected');
                }
                if (selectedItem === event.target) {
                    selectedItem = null;
                } else {
                    selectedItem = event.target;
                    selectedItem.classList.add('selected');
                }
            }
        });

        add.addEventListener('click', () => {
            inp.removeAttribute('disabled');
            if (selectedItem) {
                selectedItem.classList.remove('selected');
                selectedItem = null;
            }
            inp.value = "";
            inp.placeholder = "Type task and press Enter...";
            inp.focus();
            op.style.display = 'none';
        });

        remove.addEventListener('click', () => {
            if (selectedItem) {
                selectedItem.remove();
                selectedItem = null;
            } else if (ulList.lastElementChild) {
                ulList.lastElementChild.remove();
            }
            op.style.display = 'none';
        });

        edit.addEventListener('click', () => {
            if (selectedItem) {
                inp.removeAttribute('disabled');
                inp.value = selectedItem.textContent;
                inp.focus();
            } else if (ulList.lastElementChild) {
                selectedItem = ulList.lastElementChild;
                selectedItem.classList.add('selected');
                inp.removeAttribute('disabled');
                inp.value = selectedItem.textContent;
                inp.focus();
            }
            op.style.display = 'none';
        });

        inp.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                if (inp.value.trim() !== "") {
                    if (selectedItem) {
                        selectedItem.textContent = inp.value;
                        selectedItem.classList.remove('selected');
                        selectedItem = null;
                    } else {
                        let li = document.createElement('li');
                        li.textContent = inp.value;
                        ulList.appendChild(li);
                    }
                    inp.value = "";
                    inp.placeholder = "Press options menu to add...";
                    inp.setAttribute('disabled', 'true');
                }
            }
        });
    
        let moveUp = document.querySelector('.moveup');
        let moveDown = document.querySelector('.movedown');

        moveUp.addEventListener('click', () => {
            if (selectedItem && selectedItem.previousElementSibling) {
                selectedItem.parentNode.insertBefore(selectedItem, selectedItem.previousElementSibling);
            }
            op.style.display = 'none';
        });

        moveDown.addEventListener('click', () => {
            if (selectedItem && selectedItem.nextElementSibling) {
                selectedItem.parentNode.insertBefore(selectedItem.nextElementSibling, selectedItem);
            }
            op.style.display = 'none';
        });

    </script>
</body>
</html>
