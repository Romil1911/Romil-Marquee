<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 100%;
        }
        .container iframe{
            width:100%;
            height:100%;
            pointer-events: none; 
        }
        .circle{
            width: 10px;
            height: 10px;
            background-color: blue;
            border-radius: 50%;
            position: fixed;     
            left: 0;
            top: 0;
            transform: translate(-50%, -50%);
            pointer-events: none; 
        }

    </style>
</head>
<body>
    <div class="container">
        <iframe src="https://player.vimeo.com/video/1127104834?background=1&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479&amp;autoplay=1&amp;muted=1&amp;loop=1" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="Showreel_Namma_EN" data-ready="true">
        </iframe>
    </div>
    <div class="circle"></div>
    <script>
        let circle=document.querySelector('.circle')
        document.addEventListener('mousemove', (event)=>{
            circle.style.left=(event.clientX + 20)+"px"
            circle.style.top=(event.clientY + 20)+"px"
        });
    </script>
</body>
</html>
